<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D 5e — Skritch Cauda-de-Ferro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0d1117">
</head>
<body>

<div id="app">

  <!-- React sidebar mounts here -->
  <div id="sidebar-root"></div>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- MAIN CONTENT                                              -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <main id="main">

    <!-- ════════════════════════════════════════════════════════ -->
    <!-- VIEW: JOURNAL (still vanilla JS)                        -->
    <!-- ════════════════════════════════════════════════════════ -->
    <section id="view-journal" class="view">
      <div class="view-header">
        <h2 class="view-title">Diário de Sessões</h2>
        <input id="journal-search" class="search-input" type="search" placeholder="Buscar...">
        <button id="btn-new-session" class="add-btn">+ Nova Sessão</button>
      </div>
      <div id="journal-tag-filters" class="tag-filter-bar">
        <button class="filter-chip active" data-tag="">Todos</button>
        <button class="filter-chip" data-tag="NPC">NPC</button>
        <button class="filter-chip" data-tag="Local">Local</button>
        <button class="filter-chip" data-tag="Quest">Quest</button>
        <button class="filter-chip" data-tag="Combate">Combate</button>
        <button class="filter-chip" data-tag="Revelação">Revelação</button>
      </div>
      <div id="journal-area">
        <div id="sessions-list"></div>
      </div>
    </section>

    <!-- Modal: New/Edit Session -->
    <div id="modal-session" class="modal" style="display:none;">
      <div class="modal-backdrop"></div>
      <div class="modal-container">
        <div class="modal-header">
          <h3 class="modal-title" id="modal-session-title">Nova Sessão</h3>
          <button class="modal-close" id="modal-session-close">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Data</label>
            <input id="session-date" type="date" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Título</label>
            <input id="session-title" type="text" placeholder="Título da sessão" class="form-input" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label class="form-label">XP</label>
              <input id="session-xp" type="number" placeholder="0" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label">Ouro</label>
              <input id="session-gold" type="number" placeholder="0" class="form-input" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Resumo</label>
            <textarea id="session-summary" placeholder="O que aconteceu nesta sessão..." class="form-input" style="height:120px;resize:none;"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Participantes</label>
            <input id="session-participants" type="text" placeholder="Nomes separados por vírgula" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Eventos</label>
            <div id="modal-events-list" class="modal-events-list"></div>
            <div class="add-event-row" style="margin-top:6px;">
              <input id="modal-new-event-text" type="text" class="add-event-input" placeholder="Descreva o evento...">
              <div id="modal-event-tag-bar" class="add-event-tag-bar"></div>
              <button id="modal-add-event-btn" class="btn btn-secondary add-event-confirm-btn" type="button">+ Adicionar</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="session-cancel" class="btn btn-secondary">Cancelar</button>
          <button id="session-save" class="btn btn-primary">Salvar Sessão</button>
        </div>
      </div>
    </div>

    <!-- Modal: Delete Confirmation -->
    <div id="modal-delete" class="modal" style="display:none;">
      <div class="modal-backdrop"></div>
      <div class="modal-container" style="max-width:360px;">
        <div class="modal-header">
          <h3 class="modal-title">Confirmar exclusão</h3>
        </div>
        <div class="modal-body">
          <p id="modal-delete-text" style="color:var(--text-2);margin:0;">Tem certeza que deseja remover esta sessão? Esta ação não pode ser desfeita.</p>
        </div>
        <div class="modal-footer">
          <button id="modal-delete-cancel" class="btn btn-secondary">Cancelar</button>
          <button id="modal-delete-confirm" class="btn btn-danger">Remover Sessão</button>
        </div>
      </div>
    </div>

  </main>
</div>

<input type="file" id="portrait-upload" accept="image/*" style="display:none">

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
